<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZC Studio Ocean Sunset</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#ffccaa, #223366); /* 日落背景渐变 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.158.0';
    import { OrbitControls } from 'https://esm.sh/three@0.158.0/examples/jsm/controls/OrbitControls';
    import { Water } from 'https://esm.sh/three@0.158.0/examples/jsm/objects/Water2';
    import { FontLoader } from 'https://esm.sh/three@0.158.0/examples/jsm/loaders/FontLoader';
    import { TextGeometry } from 'https://esm.sh/three@0.158.0/examples/jsm/geometries/TextGeometry';

    // 场景
    const scene = new THREE.Scene(); // 树形结构
    scene.background = new THREE.Color(0xffffff); // 背景白色
    const textureLoader = new THREE.TextureLoader();

    const normalMap0 = textureLoader.load('https://threejs.org/examples/textures/waternormals.jpg');
    const normalMap1 = textureLoader.load('https://threejs.org/examples/textures/waternormals.jpg');
    // 相机
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 30);


    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 控制器
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 环境光
    const ambientLight = new THREE.AmbientLight(0xffcaaa, 0.5);
    scene.add(ambientLight);




    // 方向光，模拟太阳光
    const directionalLight = new THREE.DirectionalLight(0xff8844, 1.0);
    directionalLight.position.set(-30, 50, 30);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // 日落方向光
    const sunLight = new THREE.DirectionalLight(0xff8844, 1.2);
    sunLight.position.set(-30, 50, 30);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // 海面
    const waterGeometry = new THREE.PlaneGeometry(1000, 1000);
    const water = new Water(waterGeometry, {
    color: '#3399ff',
    scale: 4,
    flowDirection: new THREE.Vector2(1, 1),
    textureWidth: 1024,
    textureHeight: 1024,
    normalMap0: normalMap0,
    normalMap1: normalMap1
    });
    water.rotation.x = -Math.PI / 2;
    scene.add(water);

    // 地面接收阴影（可选）
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.ShadowMaterial({ opacity: 0.2 })
    ); // mesh是三角网
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    // 加载字体
    const loader = new FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', font => {
      const textGeo = new TextGeometry('ZC studio', {
        font: font,
        size: 4,
        height: 1.5,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.15,
        bevelSize: 0.3,
        bevelSegments: 5
      });

      textGeo.center();

      const textMaterial = new THREE.MeshStandardMaterial({
        color: 0xff7744,
        metalness: 0.5,
        roughness: 0.2
      });

      const textMesh = new THREE.Mesh(textGeo, textMaterial);
      textMesh.castShadow = true;
      textMesh.position.y = 4;
      scene.add(textMesh);
    });

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      // water.material.uniforms['time'].value += 1.0 / 60.0;
      controls.update();
      renderer.render(scene, camera); // 渲染场景
    }

    animate();

    // 适配窗口大小
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
